# Labels and text of the Services page and of every service page.
# The text of each service itself is in content/services/*.md.
# TODO(content): owner to review all wording marked "draft".

# The Services page: the list of all services.
hub:
  seo:
    title: Environmental Consultancy & Engineering Services
    description: "The thirteen environmental services offered by Envirosphere Consultant & Engineers, from clearances and compliance to treatment plant operation."
  hero:
    eyebrow: Services
    title: Thirteen environmental services.
    lead: From environmental clearances to the operation and maintenance of treatment plants.
  # Read aloud by screen readers for the list of services.
  listLabel: Services List
  # Shown at the bottom of every service card.
  viewLabel: View Specifications
  # Sage call-to-action panel at the bottom. `secondaryCta` is optional.
  cta:
    label: Consultation
    heading: Not sure which clearances or studies your project requires?
    lead: Tell us about your project and we will help you work out which approvals it needs.
    primaryCta: { label: Discuss Your Project, href: /contact/ }
    secondaryCta: { label: About us, href: /about/ }

# Labels on every service page and the closing contact box.
serviceDetail:
  breadcrumbHome: Home
  breadcrumbServices: Services
  # Read aloud by screen readers for the breadcrumb trail.
  breadcrumbLabel: Breadcrumbs
  # Browser tab title when a service address does not exist.
  notFoundTitle: Service Not Found
  label: Service
  previousLabel: Previous service
  nextLabel: Next service
  contact:
    label: Discuss this service
    heading: Tell us about your project.
    body: Our team will help you work out which approvals your project needs.
    primaryCta: { label: Start a conversation, href: /contact/ }
    phoneLabel: Call us
    emailLabel: Email us
