process:
  label: How we work
  heading: From first study to final consent.
  steps:
    # Draft: owner to review the wording. Steps are inferred from the services list, not taken from the old site.
    # `image` is the picture revealed on the left while this step is active (a name from media.yaml).
    # Leave it out and a placeholder box is shown. These are stand-ins from the photo gallery: swap them for
    # pictures that really show each step.
    - title: Scoping
      body: We study your project, its location and the rules that apply, and list the approvals you need.
      image: photo-g08
    - title: Assessment
      body: Our specialists carry out the studies and prepare the assessment and management plans.
      image: photo-g22
    - title: Submission
      body: We file the applications and follow them up with MoEFCC, the Pollution Control Boards, MIDC and other authorities.
      image: photo-g07
    - title: Compliance
      body: After approval we handle post-clearance compliance, monitoring and audits.
      image: photo-g13

